<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>micro:bit logger</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #667085;
      --line: #d0d5dd;
      --bg: #f7f8fa;
      --header: #1a1e24;
      --header-ink: #e8eaed;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 "Segoe UI", Arial, sans-serif;
    }
    .toolbar {
      display: flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      background: var(--header);
      color: var(--header-ink);
      font-size: 18px;
      font-weight: 400;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .choice {
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .choice:hover {
      border-color: #2f6feb;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }
    .choice h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .choice p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="toolbar">micro:bit logger</header>
  <main>
    <a class="choice" href="templog/index.html">
      <h2>Temperature logger</h2>
      <p>Live graph of temperature over time.</p>
    </a>
  </main>
</body>
</html>
